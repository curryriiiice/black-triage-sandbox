# Conventional CI (no AI): tests the triage skill's deterministic scripts and checks that
# the label policy, the workflow source and the compiled lock file have not drifted apart.
name: skill-tests

on:
  push:
    branches: [main]
    paths:
      - ".claude/**"
      - ".github/workflows/issue-triage.md"
      - ".github/workflows/issue-triage.lock.yml"
      - ".github/workflows/skill-tests.yml"
  pull_request:
    paths:
      - ".claude/**"
      - ".github/workflows/issue-triage.md"
      - ".github/workflows/issue-triage.lock.yml"
      - ".github/workflows/skill-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest>=8"
      - name: Unit + drift tests, plus real Black install/repro tests
        env:
          RUN_NETWORK_TESTS: "1"
        run: python -m pytest .claude/skills/black-issue-triage -v
